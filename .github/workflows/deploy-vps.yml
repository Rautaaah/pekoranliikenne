name: Deploy

on:
  push:
    branches: [ main ]

env:
  WEBSITE_SERVICE: SansyWebsite
  GAMESERVER_SERVICE: SansyGameServer
  DEPLOY_DIR: C:\BB\zokoro\sansy

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Stop services
        shell: cmd
        run: |
          net stop "%WEBSITE_SERVICE%"
          net stop "%GAMESERVER_SERVICE%"
          exit /b 0

      - name: Copy files
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "%DEPLOY_DIR%" /E /XD .git .github /XF .env
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - name: Start services
        shell: cmd
        run: |
          net start "%WEBSITE_SERVICE%"
          net start "%GAMESERVER_SERVICE%"
