name: Deploy

on:
  push:
    branches: [ main ]

env:
  DEPLOY_DIR: C:\Sansy

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Stop site processes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $deployRoot = [System.IO.Path]::GetFullPath($env:DEPLOY_DIR).TrimEnd('\')
          $processesById = @{}
          Get-CimInstance Win32_Process | ForEach-Object {
            $processesById[[int]$_.ProcessId] = $_
          }

          $listenerProcessIds = [System.Collections.Generic.HashSet[int]]::new()
          $deploymentProcessIds = [System.Collections.Generic.HashSet[int]]::new()
          foreach ($port in @(3000, 5000)) {
            $componentRoot = if ($port -eq 3000) {
              Join-Path $deployRoot 'frontend'
            } else {
              Join-Path $deployRoot 'Roblox\Roblox.Website'
            }
            $listeners = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            foreach ($listener in $listeners) {
              $processId = [int]$listener.OwningProcess
              [void]$listenerProcessIds.Add($processId)
              [void]$deploymentProcessIds.Add($processId)

              $process = $processesById[$processId]
              $depth = 0
              while ($process -and $process.ParentProcessId -gt 0 -and $depth -lt 16) {
                $parent = $processesById[[int]$process.ParentProcessId]
                if (-not $parent) {
                  break
                }

                if ($parent.Name -in @('cmd.exe', 'node.exe', 'dotnet.exe', 'npm.exe') -and
                    $parent.CommandLine -and
                    $parent.CommandLine.IndexOf($componentRoot, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
                  [void]$deploymentProcessIds.Add([int]$parent.ProcessId)
                }

                $process = $parent
                $depth++
              }
            }
          }

          $processIds = @($deploymentProcessIds)
          $processIds = @($processIds | Sort-Object { if ($listenerProcessIds.Contains($_)) { 1 } else { 0 } })
          foreach ($processId in $processIds) {
            Stop-Process -Id $processId -Force -ErrorAction Stop
          }

      - name: Copy files
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "%DEPLOY_DIR%" /E /XD .git .github /XF .env
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - name: Build frontend
        shell: cmd
        run: |
          cd /d "%DEPLOY_DIR%\frontend"
          call npm run build

      - name: Build website
        shell: cmd
        run: |
          cd /d "%DEPLOY_DIR%\Roblox\Roblox.Website"
          dotnet build --configuration Release

      - name: Start site
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $deployRoot = [System.IO.Path]::GetFullPath($env:DEPLOY_DIR).TrimEnd('\')
          $logDirectory = Join-Path $env:DEPLOY_DIR 'logs'
          New-Item -ItemType Directory -Force -Path $logDirectory | Out-Null

          function Test-PortListening([int]$port) {
            return [bool](Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -First 1)
          }

          function Start-DetachedCommand([string]$name, [string]$commandLine, [string]$workingDirectory) {
            $result = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine = $commandLine
              CurrentDirectory = $workingDirectory
            }
            if ($result.ReturnValue -ne 0) {
              throw "Could not launch $name (Win32_Process.Create returned $($result.ReturnValue))."
            }
          }

          function Start-DetachedBatch([string]$name, [string]$directory, [string]$script) {
            $scriptPath = Join-Path $directory $script
            if (-not (Test-Path $scriptPath)) {
              throw "Required startup script is missing: $scriptPath"
            }

            $logPath = Join-Path $logDirectory "$name.log"
            $commandLine = 'cmd.exe /c ""{0}" > "{1}" 2>&1"' -f $scriptPath, $logPath
            Start-DetachedCommand $name $commandLine $directory
          }

          $postgres = Get-Service -Name 'postgresql-x64-17' -ErrorAction Stop
          if ($postgres.Status -ne 'Running') {
            Start-Service -Name $postgres.Name -ErrorAction Stop
            (Get-Service -Name $postgres.Name).WaitForStatus(
              [System.ServiceProcess.ServiceControllerStatus]::Running,
              [TimeSpan]::FromSeconds(60))
          }

          if (-not (Test-PortListening 6379)) {
            $redisServer = Join-Path $deployRoot 'redis-server.exe'
            $redisConfig = Join-Path $deployRoot 'redis.conf'
            if (-not (Test-Path $redisServer) -or -not (Test-Path $redisConfig)) {
              throw 'Redis is not listening and its executable or configuration is missing.'
            }
            $redisLog = Join-Path $logDirectory 'redis.log'
            $commandLine = 'cmd.exe /c ""{0}" "{1}" > "{2}" 2>&1"' -f $redisServer, $redisConfig, $redisLog
            Start-DetachedCommand 'redis' $commandLine $deployRoot
          }

          if (-not (Test-PortListening 4300)) {
            Start-DetachedBatch 'asset-validation' (Join-Path $deployRoot 'AssetValidationServiceV2') 'run.bat'
          }

          if (-not (Test-PortListening 3000)) {
            Start-DetachedBatch 'frontend' (Join-Path $deployRoot 'frontend') 'start.bat'
          }

          if (-not (Test-PortListening 5000)) {
            $websiteDirectory = Join-Path $deployRoot 'Roblox\Roblox.Website'
            $websiteDll = Join-Path $websiteDirectory 'bin\Release\net8.0\Roblox.Website.dll'
            if (-not (Test-Path $websiteDll)) {
              throw "Website build output is missing: $websiteDll"
            }
            $dotnet = (Get-Command dotnet.exe -ErrorAction Stop).Source
            $websiteLog = Join-Path $logDirectory 'website.log'
            $commandLine = 'cmd.exe /c ""{0}" "{1}" > "{2}" 2>&1"' -f $dotnet, $websiteDll, $websiteLog
            Start-DetachedCommand 'website' $commandLine $websiteDirectory
          }

      - name: Verify site listeners
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          foreach ($port in @(3000, 5000)) {
            $deadline = (Get-Date).AddSeconds(180)
            do {
              $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($listener) {
                break
              }

              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)

            if (-not $listener) {
              $serviceName = if ($port -eq 3000) { 'frontend' } else { 'website' }
              throw "Site did not start listening on port $port. Check $env:DEPLOY_DIR\logs\$serviceName.log."
            }
          }

      - name: Verify Discord signup redirect
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $headers = & curl.exe --silent --show-error --max-time 15 --dump-header - --output NUL http://127.0.0.1:3000/api/discord/signup
          if ($LASTEXITCODE -ne 0) {
            throw "Could not request the Discord signup endpoint."
          }

          $locationLine = $headers | Where-Object { $_ -match '(?i)^location:\s*' } | Select-Object -Last 1
          if (-not $locationLine) {
            throw "Discord signup endpoint did not return an OAuth redirect."
          }

          $authorizationUri = [Uri](($locationLine -replace '(?i)^location:\s*', '').Trim())
          if ($authorizationUri.Host -ne 'discord.com' -or $authorizationUri.AbsolutePath -ne '/oauth2/authorize') {
            throw "Discord signup endpoint did not redirect to Discord's authorization endpoint."
          }

          $redirectUriMatch = [regex]::Match($authorizationUri.Query, '(?:\?|&)redirect_uri=([^&]+)')
          if (-not $redirectUriMatch.Success) {
            throw "Discord authorization URL did not include a redirect_uri."
          }

          $redirectUri = [Uri]::UnescapeDataString($redirectUriMatch.Groups[1].Value)
          if ($redirectUri -ne 'https://sansy.shop/api/applicationcallback') {
            throw "Discord signup callback URI is incorrect."
          }
